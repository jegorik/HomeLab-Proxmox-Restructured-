---
# =============================================================================
# Base Role - Default Variables
# =============================================================================

# Base packages to install
base_packages:
  - curl
  - wget
  - gnupg
  - ca-certificates
  - apt-transport-https
  - python3
  - python3-pip
  - vim
  - htop
  - tree
  - jq
  - net-tools
  - qemu-guest-agent
  - nfs-common

# Timezone and locale
base_timezone: "UTC"
base_locale: "en_US.UTF-8"

# SSH hardening settings
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_pubkey_authentication: "yes"

# NFS Docker volumes persistence
# When enabled, mounts PVE host NFS export at /var/lib/docker/volumes
# so all Docker named volumes persist across VM reinstalls
docker_volumes_nfs_enabled: true
docker_volumes_nfs_server: ""
docker_volumes_nfs_export_path: "/rpool/datastore/docker-pool/volumes"
docker_volumes_nfs_mount_path: "/var/lib/docker/volumes"
docker_volumes_nfs_options: "nfs4,defaults,_netdev,noatime"

# UFW firewall allowed ports
ufw_allowed_ports:
  - { port: 22, proto: tcp, comment: "SSH" }
  - { port: 9443, proto: tcp, comment: "Portainer HTTPS" }
  - { port: 11000, proto: tcp, comment: "Nextcloud HTTPS" }
  - { port: 8080, proto: tcp, comment: "Nextcloud AIO master container" }
